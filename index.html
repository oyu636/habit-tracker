<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Habit Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --bg: #222224;
      --card: #38383a;
      --text: #ffffff;
      --text-dim: #8e8e93;
      --accent: #ff453a;
    }
    body {
      font-family: -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 16px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      margin-top: env(safe-area-inset-top);
      padding: 0 4px;
    }
    .header-title {
      font-size: 22px;
      font-weight: bold;
    }
    .add-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      width: 100%;
      margin-bottom: 12px;
    }
    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: var(--text-dim);
      border: 1px solid #4a4a4c;
      border-radius: 4px;
      cursor: pointer;
    }
    .day.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .day.dashed {
      border: 1px dashed var(--text-dim);
    }
    .stat {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title {
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      word-break: break-all;
      /* 名前部分をタップしやすくするために少し余白を追加 */
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    /* タップした時に少し背景を暗くして反応を見せる */
    .title:active {
      background-color: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">マイトラッカー</div>
    <button class="add-btn" onclick="addNewTask()">＋</button>
  </div>
  
  <div class="grid" id="app"></div>

  <script>
    const defaultTasks = [
      { id: 't1', title: '顔の運動7種', icon: '🔥', dashed: [] },
      { id: 't2', title: 'ジム1h(🏃‍♀️30m,他)', icon: '🔥', dashed: [6] },
      { id: 't3', title: '太もも', icon: '🔥', dashed: [] },
      { id: 't4', title: 'プランク1m', icon: '🔥', dashed: [] },
      { id: 't5', title: '背中', icon: '🔥', dashed: [] },
      { id: 't6', title: 'web関連制作1h', icon: '🔥', dashed: [6] }
    ];

    let tasks = JSON.parse(localStorage.getItem('dothabit_tasks')) || defaultTasks;
    let data = JSON.parse(localStorage.getItem('dothabit_data')) || {};
    const app = document.getElementById('app');

    function renderTasks() {
      app.innerHTML = ''; 
      
      tasks.forEach(task => {
        if (!data[task.id]) data[task.id] = [];
        const card = document.createElement('div');
        card.className = 'card';
        
        const cal = document.createElement('div');
        cal.className = 'cal';
        
        for (let i = 1; i <= 30; i++) {
          const d = document.createElement('div');
          d.className = 'day';
          d.textContent = i;
          
          if (data[task.id].includes(i)) {
            d.classList.add('active');
          } else if (task.dashed && task.dashed.includes(i)) {
            d.classList.add('dashed');
          }
          
          d.onclick = () => {
            if (data[task.id].includes(i)) {
              data[task.id] = data[task.id].filter(v => v !== i);
              d.classList.remove('active');
            } else {
              data[task.id].push(i);
              d.classList.add('active');
              d.classList.remove('dashed');
            }
            localStorage.setItem('dothabit_data', JSON.stringify(data));
            updateStat();
          };
          cal.appendChild(d);
        }
        
        const stat = document.createElement('div');
        stat.className = 'stat';
        const updateStat = () => {
          const count = data[task.id].length;
          const iconColor = count > 0 ? 'var(--accent)' : 'var(--text-dim)';
          stat.innerHTML = `<span style="color: ${iconColor}; font-size: 16px;">${task.icon}</span> ${count}`;
        };
        updateStat();
        
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = task.title;
        
        // --- 今回の追加部分：ダブルタップで名前を変更 ---
        let lastTap = 0;
        title.addEventListener('click', (e) => {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTap;
          
          // 0.5秒（500ms）以内に2回タップされたら発動
          if (tapLength < 500 && tapLength > 0) {
            // 現在の名前が入力された状態でポップアップを出す
            const newTitle = prompt("項目の名前を変更します:", task.title);
            
            // キャンセルされず、かつ空欄でない場合のみ更新
            if (newTitle !== null && newTitle.trim() !== "") {
              task.title = newTitle.trim(); 
              localStorage.setItem('dothabit_tasks', JSON.stringify(tasks)); // リストを保存
              title.textContent = task.title; // 画面を更新
            }
            e.preventDefault();
          }
          lastTap = currentTime;
        });
        //
