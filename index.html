<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Habit Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --bg: #222224;
      --card: #38383a;
      --text: #ffffff;
      --text-dim: #8e8e93;
      --accent: #ff453a;
    }
    body {
      font-family: -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 16px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      margin-top: env(safe-area-inset-top);
      padding: 0 4px;
    }
    .header-title {
      font-size: 22px;
      font-weight: bold;
    }
    .add-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 22px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer; /* 余白タップ用 */
    }
    .card:active {
      background: #444446;
    }
    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      width: 100%;
      margin-bottom: 12px;
    }
    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: var(--text-dim);
      border: 1px solid #4a4a4c;
      border-radius: 4px;
    }
    .day.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .day.dashed {
      border: 1px dashed var(--text-dim);
    }
    .stat {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title {
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      word-break: break-all;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .title:active {
      background-color: rgba(255,255,255,0.1);
    }

    /* --- 追加：履歴モーダル（全画面表示）のスタイル --- */
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      z-index: 1000;
      padding: 20px 16px;
      overflow-y: auto;
      padding-top: max(20px, env(safe-area-inset-top));
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .modal-title {
      font-size: 20px;
      font-weight: bold;
    }
    .close-btn {
      background: #4a4a4c;
      color: white;
      border: none;
      border-radius: 16px;
      padding: 6px 14px;
      font-weight: bold;
      cursor: pointer;
    }
    /* 3列×4列のミニカレンダー */
    .months-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 12px;
    }
    .mini-month {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .mini-month-name {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .mini-cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      width: 100%;
    }
    .mini-day {
      aspect-ratio: 1;
      border-radius: 2px;
      background: #38383a;
    }
    .mini-day.active {
      background: var(--accent);
    }
    /* 西暦選択部分 */
    .year-selector {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 40px;
      padding-bottom: 40px;
    }
    .year-btn {
      font-size: 18px;
      color: var(--text-dim);
      padding: 4px 8px;
      border-radius: 6px;
    }
    .year-btn.current {
      color: white;
      font-weight: bold;
      border-bottom: 2px solid var(--accent);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">マイトラッカー</div>
    <button class="add-btn" onclick="addNewTask()">＋</button>
  </div>
  
  <div class="grid" id="app"></div>

  <!-- 履歴表示用モーダル画面 -->
  <div id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">記録</div>
      <button class="close-btn" onclick="closeModal()">閉じる</button>
    </div>
    <div class="months-grid" id="months-grid"></div>
    <div class="year-selector" id="year-selector"></div>
  </div>

  <script>
    const defaultTasks = [
      { id: 't1', title: '顔の運動7種', icon: '🔥', dashed: [] },
      { id: 't2', title: 'ジム1h(🏃‍♀️30m,他)', icon: '🔥', dashed: [6] },
      { id: 't3', title: '太もも', icon: '🔥', dashed: [] },
      { id: 't4', title: 'プランク1m', icon: '🔥', dashed: [] },
      { id: 't5', title: '背中', icon: '🔥', dashed: [] },
      { id: 't6', title: 'web関連制作1h', icon: '🔥', dashed: [6] }
    ];

    let tasks = JSON.parse(localStorage.getItem('dothabit_tasks')) || defaultTasks;
    let data = JSON.parse(localStorage.getItem('dothabit_data')) || {};
    const app = document.getElementById('app');

    // 現在の年と月を取得
    const today = new Date();
    const currentYear = today.getFullYear();
    const currentMonth = today.getMonth() + 1;
    // 今月が何日あるかを計算（例：11月なら30）
    const daysInCurrentMonth = new Date(currentYear, currentMonth, 0).getDate();

    // 日付を「YYYY-MM-DD」形式の文字列にする関数
    const formatDate = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

    // 【データ自動移行】古いデータ（数字だけ）があれば今月のデータ（YYYY-MM-DD）に変換する
    for (let id in data) {
      if (data[id].length > 0 && typeof data[id][0] === 'number') {
        data[id] = data[id].map(day => formatDate(currentYear, currentMonth, day));
        localStorage.setItem('dothabit_data', JSON.stringify(data));
      }
    }

    function renderTasks() {
      app.innerHTML = ''; 
      
      tasks.forEach(task => {
        if (!data[task.id]) data[task.id] = [];
        const card = document.createElement('div');
        card.className = 'card';
        
        // --- 余白タップで履歴モーダルを開く処理 ---
        card.addEventListener('click', (e) => {
          // 日付マスや名前部分をタップした時はモーダルを開かない
          if (e.target.closest('.day') || e.target.closest('.title')) return;
          openModal(task, currentYear);
        });
        
        const cal = document.createElement('div');
        cal.className = 'cal';
        
        // 今月の日数分だけカレンダーを生成
        for (let i = 1; i <= daysInCurrentMonth; i++) {
          const d = document.createElement('div');
          d.className = 'day';
          d.textContent = i;
          
          const dateStr = formatDate(currentYear, currentMonth, i);
          
          if (data[task.id].includes(dateStr)) {
            d.classList.add('active');
          } else if (task.dashed && task.dashed.includes(i)) {
            d.classList.add('dashed');
          }
          
          d.onclick = (e) => {
            if (data[task.id].includes(dateStr)) {
              data[task.id] = data[task.id].filter(v => v !== dateStr);
              d.classList.remove('active');
            } else {
              data[task.id].push(dateStr);
              d.classList.add('active');
              d.classList.remove('dashed');
            }
            localStorage.setItem('dothabit_data', JSON.stringify(data));
            updateStat();
          };
          cal.appendChild(d);
        }
        
        const stat = document.createElement('div');
        stat.className = 'stat';
        const updateStat = () => {
          // 今月の達成回数をカウント
          const currentMonthCount = data[task.id].filter(date => date.startsWith(`${currentYear}-${String(currentMonth).padStart(2, '0')}`)).length;
          const iconColor = currentMonthCount > 0 ? 'var(--accent)' : 'var(--text-dim)';
          stat.innerHTML = `<span style="color: ${iconColor}; font-size: 16px;">${task.icon}</span> ${currentMonthCount}`;
        };
        updateStat();
        
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = task.title;
        
        // ダブルタップで名前変更
        let lastTap = 0;
        title.addEventListener('click', (e) => {
          const currentTime = new Date().getTime();
          const tapLength = currentTime - lastTap;
          
          if (tapLength < 500 && tapLength > 0) {
            const newTitle = prompt("項目の名前を変更します:", task.title);
            if (newTitle !== null && newTitle.trim() !== "") {
              task.title = newTitle.trim(); 
              localStorage.setItem('dothabit_tasks', JSON.stringify(tasks));
              title.textContent = task.title; 
            }
            e.preventDefault();
          }
          lastTap = currentTime;
        });
        
        card.append(cal, stat, title);
        app.appendChild(card);
      });
    }

    function addNewTask() {
      const title = prompt("新しい項目の名前を入力してください:");
      if (!title || title.trim() === "") return; 
      
      const newId = 't_' + Date.now();
      tasks.push({ id: newId, title: title.trim(), icon: '🔥', dashed: [] });
      localStorage.setItem('dothabit_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    // --- 履歴モーダル関連の処理 ---
    const modal = document.getElementById('modal');
    
    function openModal(task, yearToShow) {
      modal.style.display = 'block';
      document.getElementById('modal-title').textContent = `${task.title} (${yearToShow}年)`;
      
      const grid = document.getElementById('months-grid');
      grid.innerHTML = '';
      
      // 1月〜12月のミニカレンダー（3列×4列）を生成
      for (let m = 1; m <= 12; m++) {
        const monthDiv = document.createElement('div');
        monthDiv.className = 'mini-month';
        
        const monthName = document.createElement('div');
        monthName.className = 'mini-month-name';
        monthName.textContent = `${m}月`;
        
        const miniCal = document.createElement('div');
        miniCal.className = 'mini-cal';
        
        const daysInM = new Date(yearToShow, m, 0).getDate();
        for (let d = 1; d <= daysInM; d++) {
          const miniDay = document.createElement('div');
          miniDay.className = 'mini-day';
          const dateStr = formatDate(yearToShow, m, d);
          if (data[task.id] && data[task.id].includes(dateStr)) {
            miniDay.classList.add('active');
          }
          miniCal.appendChild(miniDay);
        }
        
        monthDiv.appendChild(monthName);
        monthDiv.appendChild(miniCal);
        grid.appendChild(monthDiv);
      }
      
      // 下部の西暦リストを生成
      generateYearSelector(task, yearToShow);
    }
    
    function generateYearSelector(task, activeYear) {
      const selector = document.getElementById('year-selector');
      selector.innerHTML = '';
      
      // データから記録のある西暦を全て抽出
      const yearsSet = new Set();
      yearsSet.add(currentYear); // 現在の年は必ず入れる
      if (data[task.id]) {
        data[task.id].forEach(dateStr => {
          yearsSet.add(parseInt(dateStr.split('-')[0]));
        });
      }
      const years = Array.from(yearsSet).sort((a, b) => a - b);
      
      years.forEach(year => {
        const yearBtn = document.createElement('div');
        yearBtn.className = 'year-btn';
        if (year === activeYear) yearBtn.classList.add('current');
        yearBtn.textContent = year;
        
        // ダブルタップで西暦を切り替え
        let lastYearTap = 0;
        yearBtn.addEventListener('click', (e) => {
          const currentTime = new Date().getTime();
          if (currentTime - lastYearTap < 500 && currentTime - lastYearTap > 0) {
            openModal(task, year);
          }
          lastYearTap = currentTime;
        });
        
        selector.appendChild(yearBtn);
      });
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    renderTasks();
  </script>
</body>
</html>
